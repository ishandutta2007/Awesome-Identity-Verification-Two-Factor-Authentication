<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>

    <style>
      .radar-sweep {
        transform-origin: 980px 210px;
        animation: rotateSweep 12s linear infinite;
      }
      .pulse-circle {
        animation: pulseScale 3.5s ease-in-out infinite;
        transform-origin: 980px 210px;
      }
      .pulse-circle-delayed {
        animation: pulseScale 3.5s ease-in-out infinite 1.8s;
        transform-origin: 980px 210px;
      }
      .float-badge {
        animation: floatAnim 5s ease-in-out infinite alternate;
      }
      .float-badge-rev {
        animation: floatAnimRev 6s ease-in-out infinite alternate;
      }
      .cyber-flow {
        stroke-dasharray: 8 16;
        animation: flowDash 20s linear infinite;
      }
      .scanline {
        animation: scanlineMove 6s ease-in-out infinite;
      }
      @keyframes rotateSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseScale {
        0% { transform: scale(0.8); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 0.2; }
        100% { transform: scale(0.8); opacity: 0.8; }
      }
      @keyframes floatAnim {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatAnimRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(12px); }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes scanlineMove {
        0%, 100% { transform: translateY(40px); opacity: 0; }
        50% { transform: translateY(380px); opacity: 0.35; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Ambient Orbs (Background layer) -->
  <circle cx="200" cy="120" r="160" fill="#0284c7" opacity="0.18" filter="url(#blurFilter)"/>
  <circle cx="1020" cy="220" r="180" fill="#7c3aed" opacity="0.22" filter="url(#blurFilter)"/>
  <circle cx="600" cy="380" r="140" fill="#0d9488" opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Scanning dynamic bar -->
  <line x1="40" y1="0" x2="1160" y2="0" stroke="url(#accentGrad)" stroke-width="2" class="scanline" filter="url(#glow)"/>

  <!-- Dynamic Circuit Flow Lines (Background) -->
  <path d="M 50 100 Q 250 180 500 120 T 950 180" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="2" class="cyber-flow"/>
  <path d="M 50 320 Q 350 240 700 320 T 1150 260" fill="none" stroke="rgba(168, 85, 247, 0.2)" stroke-width="2" class="cyber-flow"/>

  <!-- Right Visual Graphics: Biometric & Security Ring (Behind foreground text) -->
  <g id="security-ring-system">
    <!-- Pulse Rings -->
    <circle cx="980" cy="210" r="120" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" class="pulse-circle"/>
    <circle cx="980" cy="210" r="150" fill="none" stroke="rgba(168, 85, 247, 0.25)" stroke-width="1.5" class="pulse-circle-delayed"/>
    
    <!-- Outer dashed tech circle -->
    <circle cx="980" cy="210" r="135" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="6 8"/>

    <!-- Radar sweep -->
    <g class="radar-sweep">
      <path d="M 980 210 L 1115 210 A 135 135 0 0 0 980 75 Z" fill="url(#glowG)"/>
      <line x1="980" y1="210" x2="1115" y2="210" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    </g>

    <!-- Center Security Shield -->
    <g filter="url(#glow)">
      <!-- Shield shape -->
      <path d="M 980 145 L 1025 165 C 1025 215 980 245 980 255 C 980 245 935 215 935 165 Z" 
            fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="4"/>
      <!-- Keyhole / Checkmark icon -->
      <path d="M 960 200 L 975 215 L 1005 185" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="980" cy="180" r="7" fill="#38bdf8"/>
    </g>

    <!-- Floating Badge 1: FIDO2 / WebAuthn -->
    <g class="float-badge" transform="translate(850, 80)">
      <rect width="130" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔑 Passkeys</text>
    </g>

    <!-- Floating Badge 2: Biometrics IDV -->
    <g class="float-badge-rev" transform="translate(1010, 310)">
      <rect width="130" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.4)" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="5" fill="#a855f7"/>
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ IDV / KYC</text>
    </g>

    <!-- Floating Badge 3: MFA / 2FA -->
    <g class="float-badge" transform="translate(830, 310)">
      <rect width="120" height="34" rx="17" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1.5"/>
      <circle cx="20" cy="17" r="5" fill="#22c55e"/>
      <text x="34" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📱 2FA / TOTP</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT: Header, Title, Subtitle, Highlights (Crisp, High Contrast) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill Tag -->
    <g transform="translate(0, 60)">
      <rect width="320" height="32" rx="16" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1"/>
      <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
      <text x="28" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title (Strictly Foreground) -->
    <text x="0" y="145" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Identity Verification &amp;
    </text>
    <text x="0" y="195" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Two-Factor Authentication
    </text>

    <!-- Subtitle -->
    <text x="0" y="245" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Enterprise SaaS Platforms, Open-Source IdPs, Passkeys, WebAuthn &amp; Biometric IDV
    </text>

    <!-- Feature Pillars Badges / Stats -->
    <g transform="translate(0, 285)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="170" height="46" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
      <text x="16" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🌐 10+ Top SaaS</text>

      <!-- Pill 2 -->
      <rect x="185" y="0" width="185" height="46" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
      <text x="201" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">⚡ 28+ Open Source</text>

      <!-- Pill 3 -->
      <rect x="385" y="0" width="205" height="46" rx="10" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="1"/>
      <text x="401" y="28" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600">🔐 Passkeys &amp; FIDO2</text>
    </g>

    <!-- Footer meta -->
    <text x="2" y="375" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
      Regularly Updated • Community Maintained • Complete Pricing &amp; Star Metrics
    </text>
  </g>

  <!-- Border accent -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
</svg>
